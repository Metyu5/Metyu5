name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: STEPHANUS-SAPUTRA-TUPAMAHU
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#ebedf0,#9be9a8,#9be9a8,#9be9a8,#9be9a8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#161b22,#39d353,#39d353,#39d353,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
